name: Irate-Box app bundle (room)

# Builds the excalidraw-room collaboration relay: dist/ plus its production dependencies, plain JS, run by Debian's nodejs on the hub (install.sh --with-collab) for the Irate-Box hub and uploads it as a run artifact,
# irate-box-room-<commit>, which the hub's librarian can install (through nightly.link, or with
# a GitHub token). No releases: this is a fork for testing. Built from this repository.
# The bundle carries irate-box-bundle.json: which repository and commit it was built from.
# Artifacts expire after 90 days, so this also runs monthly.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main

permissions:
  contents: read

concurrency:
  group: irate-box-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          # The hub runs it with Debian trixie's nodejs, which is 20.
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Assemble the relay with its runtime dependencies only
        # package.json lists the build tools (typescript, eslint, ts-node-dev…) as dependencies
        # too, so the runtime set comes from what dist/ actually requires. Versions still come
        # from yarn.lock (--pure-lockfile reads it without rewriting it).
        run: |
          mkdir -p bundle
          cp -r dist yarn.lock bundle/
          node -e '
            const fs = require("fs");
            const src = fs.readdirSync("dist").filter((f) => f.endsWith(".js"))
              .map((f) => fs.readFileSync(`dist/${f}`, "utf8")).join("\n");
            const used = new Set([...src.matchAll(/require\("([^"./][^"]*)"\)/g)]
              .map((m) => m[1].startsWith("@") ? m[1].split("/").slice(0, 2).join("/") : m[1].split("/")[0]));
            const pkg = require("./package.json");
            const dependencies = {};
            for (const name of used) if (pkg.dependencies && pkg.dependencies[name]) dependencies[name] = pkg.dependencies[name];
            fs.writeFileSync("bundle/package.json", JSON.stringify(
              { name: pkg.name, private: true, main: "dist/index.js", dependencies }, null, 2));
            console.log("runtime dependencies:", Object.keys(dependencies).join(", "));'
          (cd bundle && yarn install --production --pure-lockfile --ignore-scripts --non-interactive)
          rm -rf bundle/node_modules/.bin bundle/yarn.lock
      - name: Third-party notices
        # THIRD-PARTY-NOTICES.txt in the bundle: what npm does not describe first, then every
        # package installed under node_modules with its license text -- a superset of what the
        # bundle contains, since bundlers also take from devDependencies.
        run: |
          out="bundle/THIRD-PARTY-NOTICES.txt"
          {
            cat <<NOTICE
          excalidraw-room collaboration relay (MIT License), built for the Irate-Box hub from ${{ github.repository }} at ${{ github.sha }}.
          Source: https://github.com/${{ github.repository }}/tree/${{ github.sha }}

          NOTICE
            cat <<'NOTICE'
          The packages below are exactly the ones in this bundle's node_modules.

          NOTICE
            node .github/scripts/irate-box-notices.mjs bundle/node_modules
          } > "$out"
          du -h "$out"
      - name: Record what was built
        run: |
          cat > "bundle/irate-box-bundle.json" <<JSON
          {"app": "room", "repository": "${{ github.repository }}", "ref": "$(git rev-parse --abbrev-ref HEAD)",
           "commit": "$(git rev-parse HEAD)", "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "run": ${{ github.run_id }}}
          JSON
          echo "SHORT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          du -sh "bundle"

      - uses: actions/upload-artifact@v7
        with:
          name: irate-box-room-${{ env.SHORT }}
          path: bundle
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
